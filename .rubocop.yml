# RuboCop 0.13.1 (locked in Gemfile.lock); era config generated by repo-setup.sh.
AllCops:
  Includes:
    - '**/*.gemspec'
    - '**/Rakefile'
    - '**/*.rake'
    - Gemfile
    - Rakefile
    - Guardfile
    - config.ru
  Excludes:
    - vendor/**
    - tmp/**
    # Generated by `rake secret`, git-ignored and untracked (single unbreakable 176-char token)
    - config/initializers/secret_token.rb

LineLength:
  Max: 120
